name: Captura Bronce odontología
on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'
permissions:
  contents: read
concurrency:
  group: captura-bronce-odontologia
  cancel-in-progress: false
jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas
        run: python -m unittest discover -s tests
      - name: Capturar páginas públicas
        run: python scripts/captura_dental.py
      - name: Guardar datos crudos de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odontologia-bronce-${{ github.run_id }}-${{ github.run_attempt }}
          path: datos/bronce/odontologia/
          retention-days: 90
          if-no-files-found: warn
