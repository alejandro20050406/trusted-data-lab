name: Captura Bronce odontología
on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'
permissions:
  # Escritura necesaria para versionar cada captura Bronce y acumular la historia.
  contents: write
concurrency:
  group: captura-bronce-odontologia
  cancel-in-progress: false
jobs:
  captura:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias E1
        run: python -m pip install -r requirements-e2.txt -r requirements-lab.txt
      - name: Pruebas
        id: pruebas
        run: python -m unittest discover -s tests
      - name: Capturar y recuperar fuentes incompletas
        id: captura
        run: python -m scripts.recoleccion_resiliente
      - name: Versionar Bronce en el repositorio
        # Se ejecuta aunque alguna fuente quede incompleta: solo las capturas completas llegan a Bronce.
        if: always() && steps.captura.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/bronce/odontologia datos/bronce/imd_catalogo
          if git diff --cached --quiet; then
            echo "Sin capturas nuevas que versionar"
            exit 0
          fi
          # [skip ci] evita que e1.yml vuelva a descargar Imdent por este commit.
          git commit -m "datos: captura Bronce ${{ github.run_id }} [skip ci]"
          for intento in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((intento * 10))
          done
          echo "No se pudo publicar la captura; queda en el artefacto de la ejecución" >&2
          exit 1
      - name: Validar y generar Plata y Oro
        if: always() && steps.captura.outcome == 'success'
        run: python -m src.e1 --salida salida-e1
      - name: Guardar resultados E1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capas-e1-${{ github.run_id }}-${{ github.run_attempt }}
          path: salida-e1/
          retention-days: 90
          if-no-files-found: warn
      - name: Guardar datos crudos de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odontologia-bronce-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            datos/bronce/odontologia/
            datos/bronce/imd_catalogo/
          retention-days: 90
          if-no-files-found: warn
      - name: Guardar evidencia de todos los intentos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intentos-captura-${{ github.run_id }}-${{ github.run_attempt }}
          path: intentos-captura/
          retention-days: 90
          if-no-files-found: warn

