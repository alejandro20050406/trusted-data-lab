name: Captura de fuentes oficiales
on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 12 * *'
permissions:
  contents: read
jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencia de lectura
        run: python -m pip install -r requirements.txt
      - name: Verificar pruebas
        run: python -m unittest discover -s tests
      - name: Descargar y validar fuentes
        run: python scripts/captura.py
      - name: Guardar datos y manifiesto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronce-${{ github.run_id }}
          path: datos/bronce/
          retention-days: 90
          if-no-files-found: error
