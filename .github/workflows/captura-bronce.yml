name: Captura Bronce odontología
on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'
permissions:
  contents: read
concurrency:
  group: captura-bronce-odontologia
  cancel-in-progress: false
jobs:
  captura:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias E1
        run: python -m pip install -r requirements-e2.txt
      - name: Pruebas
        id: pruebas
        run: python -m unittest discover -s tests
      - name: Capturar y recuperar fuentes incompletas
        id: captura
        run: python -m scripts.recoleccion_resiliente
      - name: Validar y generar Plata y Oro
        if: steps.captura.outcome == 'success'
        run: python -m src.e1 --salida salida-e1
      - name: Guardar resultados E1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capas-e1-${{ github.run_id }}-${{ github.run_attempt }}
          path: salida-e1/
          retention-days: 90
          if-no-files-found: warn
      - name: Guardar datos crudos de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odontologia-bronce-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            datos/bronce/odontologia/
            datos/bronce/imd_catalogo/
          retention-days: 90
          if-no-files-found: warn
      - name: Guardar evidencia de todos los intentos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intentos-captura-${{ github.run_id }}-${{ github.run_attempt }}
          path: intentos-captura/
          retention-days: 90
          if-no-files-found: warn

