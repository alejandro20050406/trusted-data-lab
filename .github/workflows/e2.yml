name: E2 mapa geoespacial
on:
  workflow_dispatch:
jobs:
  captura:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-e2.txt
      - run: python -m unittest discover -s tests
      - run: python -m src.geoespacial_e2 --capturar datos/bronce/osm/lote --salida salida-e2
      - uses: actions/upload-artifact@v4
        with:
          name: e2-mapa-y-bronce
          path: |
            datos/bronce/osm/lote/
            salida-e2/
          if-no-files-found: error
          retention-days: 90
