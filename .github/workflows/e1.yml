name: E1 calidad y capas
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'datos/bronce/odontologia/**'
      - 'datos/bronce/issste_insumos/**'
      - 'datos/referencias/**'
      - 'requirements-e1.txt'
      - '.github/workflows/e1.yml'
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-e1.txt
      - run: python -m unittest discover -s tests
      - name: Capturar catálogo Imdent
        id: imdent
        run: python -m scripts.captura_imdent
      - name: Generar Plata
        if: always() && steps.imdent.outcome != 'skipped'
        run: python -m src.e1 --salida salida-e1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capas-e1
          path: salida-e1/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imdent-bronce
          path: datos/bronce/imd_catalogo/
          retention-days: 90
          if-no-files-found: warn
